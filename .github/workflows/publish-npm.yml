name: Publish npm

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      within_release:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Exact public GitHub release version to publish to npm
        required: true
        type: string

concurrency:
  group: >-
    ${{ inputs.within_release
      && format('magnitude-npm-completion-{0}', github.run_id)
      || 'magnitude-production-release' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: "1.3.14"
  NPM_VERSION: "11.6.2"

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "@magnitudedev/cli@${{ inputs.version }}"
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - name: Verify released source
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./packages/launcher/package.json').version")" = "$RELEASE_VERSION"
          test "$(git rev-parse "@magnitudedev/cli@${RELEASE_VERSION}^{commit}")" = "$(git rev-parse HEAD)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: bun run packages/release/scripts/verify-public-release.ts
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ inputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          MAGNITUDE_RELEASE_MANIFEST_OUTPUT: release-candidate/magnitude-release.json
      - id: npm-candidate
        run: bun run packages/release/scripts/prepare-npm.ts release/npm-candidate --manifest release-candidate/magnitude-release.json
      - name: Verify public CLI acquisition
        run: bun run packages/release/scripts/accept-public-cli.ts "${{ steps.npm-candidate.outputs.tarball }}"
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ inputs.version }}
      - name: Publish npm through Changesets
        shell: bash
        run: |
          bun run publish -- --no-git-tag
          bun run packages/release/scripts/verify-npm.ts
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ inputs.version }}
          MAGNITUDE_EXPECTED_NPM_INTEGRITY: ${{ steps.npm-candidate.outputs.integrity }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release build

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      validate_candidate:
        required: true
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  RUST_VERSION: "1.91.1"
  NPM_VERSION: "11.6.2"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.matrix.outputs.hosts }}
      backends: ${{ steps.matrix.outputs.backends }}
      linuxHosts: ${{ steps.matrix.outputs.linuxHosts }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: matrix
        run: bun run packages/release/scripts/matrix.ts
      - id: version
        shell: bash
        run: echo "version=$(jq -r '.version' packages/launcher/package.json)" >> "$GITHUB_OUTPUT"

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run icn:catalog:build-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-inputs
          path: inference/target/catalog-inputs/
          if-no-files-found: error

  host:
    needs: [matrix, catalog]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rustTarget }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - name: Install Linux ARM64 compiler
        if: runner.os == 'Linux' && matrix.id == 'linux-arm64-gnu'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Configure Windows MSVC build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Export the x64 MSVC developer environment (cl.exe, INCLUDE, LIB) so cmake, Ninja,
          # bindgen, and nvcc find the toolset from the plain runner shell.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "No Visual Studio installation provides the MSVC x64 toolset" }
          $before = $env:Path -split ';'
          Import-Module (Join-Path $installation "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "MSVC developer environment did not expose cl.exe" }
          foreach ($entry in ($env:Path -split ';')) {
            if ($entry -and ($before -notcontains $entry)) { $entry >> $env:GITHUB_PATH }
          }
          foreach ($name in @("INCLUDE", "LIB", "LIBPATH", "VCINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "UCRTVersion", "VSCMD_ARG_TGT_ARCH", "VSCMD_ARG_HOST_ARCH")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version
          cmake --version
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          if (-not $env:LIBCLANG_PATH) {
            $libclang = "${env:ProgramFiles}\LLVM\bin"
            if (-not (Test-Path (Join-Path $libclang "libclang.dll"))) { throw "libclang.dll is required by bindgen and was not found in $libclang" }
            "LIBCLANG_PATH=$libclang" >> $env:GITHUB_ENV
          }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-inputs
          path: catalog-inputs
      - run: bun run packages/release/scripts/build/host.ts "${{ matrix.id }}" catalog-inputs "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  backend:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.backends) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - name: Install Linux ARM64 compiler
        if: runner.os == 'Linux' && matrix.host == 'linux-arm64-gnu'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Configure Windows MSVC build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Export the x64 MSVC developer environment (cl.exe, INCLUDE, LIB) so cmake, Ninja,
          # bindgen, and nvcc find the toolset from the plain runner shell.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "No Visual Studio installation provides the MSVC x64 toolset" }
          $before = $env:Path -split ';'
          Import-Module (Join-Path $installation "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "MSVC developer environment did not expose cl.exe" }
          foreach ($entry in ($env:Path -split ';')) {
            if ($entry -and ($before -notcontains $entry)) { $entry >> $env:GITHUB_PATH }
          }
          foreach ($name in @("INCLUDE", "LIB", "LIBPATH", "VCINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "UCRTVersion", "VSCMD_ARG_TGT_ARCH", "VSCMD_ARG_HOST_ARCH")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version
          cmake --version
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          if (-not $env:LIBCLANG_PATH) {
            $libclang = "${env:ProgramFiles}\LLVM\bin"
            if (-not (Test-Path (Join-Path $libclang "libclang.dll"))) { throw "libclang.dll is required by bindgen and was not found in $libclang" }
            "LIBCLANG_PATH=$libclang" >> $env:GITHUB_ENV
          }
      - name: Install Linux Vulkan tools
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        shell: bash
        run: |
          sudo apt-get install -y libvulkan-dev spirv-headers ninja-build python3
          vulkan_root="$RUNNER_TEMP/vulkan-sdk-1.4.313"
          headers_root="$RUNNER_TEMP/vulkan-headers-1.4.313"
          shaderc_root="$RUNNER_TEMP/shaderc-v2023.8"
          git clone --filter=blob:none https://github.com/google/shaderc.git "$shaderc_root"
          git -C "$shaderc_root" checkout --detach e6edd6d48fa5bdd9d176794c6810fae7f8e938e1
          python3 "$shaderc_root/utils/git-sync-deps"
          cmake \
            -S "$shaderc_root" \
            -B "$shaderc_root/build" \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D SHADERC_SKIP_TESTS=ON \
            -D SHADERC_SKIP_EXAMPLES=ON
          cmake --build "$shaderc_root/build" --target glslc_exe
          test -x "$shaderc_root/build/glslc/glslc"
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-Headers.git "$headers_root"
          git -C "$headers_root" checkout --detach 409c16be502e39fe70dd6fe2d9ad4842ef2c9a53
          cmake \
            -S "$headers_root" \
            -B "$headers_root/build" \
            -D CMAKE_INSTALL_PREFIX="$vulkan_root"
          cmake --build "$headers_root/build" --target install
          mkdir -p "$vulkan_root/bin"
          cp "$shaderc_root/build/glslc/glslc" "$vulkan_root/bin/glslc"
          "$vulkan_root/bin/glslc" --version
          test -f "$vulkan_root/include/vulkan/vulkan.hpp"
          echo "VULKAN_SDK=$vulkan_root" >> "$GITHUB_ENV"
          echo "$vulkan_root/bin" >> "$GITHUB_PATH"
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').VULKAN_SDK
          if (-not $sdk) { throw "Vulkan SDK installation did not publish VULKAN_SDK" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Install Linux CUDA toolkit
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) repository_arch=x86_64 ;;
            aarch64) repository_arch=sbsa ;;
            *) exit 1 ;;
          esac
          . /etc/os-release
          repository_distribution="ubuntu${VERSION_ID//./}"
          toolkit="${{ matrix.toolkit }}"
          package_version="${toolkit/./-}"
          curl --fail --location --silent --show-error \
            --output cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/${repository_distribution}/${repository_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring.deb
          # The keyring is fetched over TLS only; pin the signing key it installs so a
          # substituted package cannot authorize a different apt repository.
          expected_fingerprint="EB693B3035CD5710E231E123A4B469963BF863CC"
          actual_fingerprint="$(gpg --show-keys --with-colons /usr/share/keyrings/cuda-archive-keyring.gpg | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::Unexpected CUDA repository signing key fingerprint: ${actual_fingerprint:-none}"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-compiler-${package_version}" \
            "libcublas-dev-${package_version}"
          cuda_path="/usr/local/cuda-${toolkit}"
          test -x "${cuda_path}/bin/nvcc"
          test -x "${cuda_path}/bin/cuobjdump"
          test -f "${cuda_path}/include/cublas_v2.h"
          echo "CUDA_PATH=${cuda_path}" >> "$GITHUB_ENV"
          echo "${cuda_path}/bin" >> "$GITHUB_PATH"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          rm -f cuda-keyring.deb
      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        with:
          cuda: "${{ matrix.toolkit }}.0"
          method: network
      - name: Verify Windows CUDA toolkit
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) { throw "CUDA toolkit installation did not publish CUDA_PATH" }
          foreach ($file in @("bin\nvcc.exe", "bin\cuobjdump.exe", "include\cublas_v2.h")) {
            if (-not (Test-Path (Join-Path $env:CUDA_PATH $file))) { throw "CUDA toolkit is missing $file" }
          }
          $identity = & (Join-Path $env:CUDA_PATH "bin\nvcc.exe") --version
          if (-not ($identity -match "release ${{ matrix.toolkit }}")) { throw "nvcc does not report CUDA ${{ matrix.toolkit }}: $identity" }
          "$env:CUDA_PATH\bin" >> $env:GITHUB_PATH
      - run: bun install --frozen-lockfile
      - run: bun run packages/release/scripts/build/backend.ts "${{ matrix.id }}" "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  linux-consumer:
    needs: [matrix, host]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.linuxHosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}
      - run: bun run packages/release/scripts/validate-host.ts "${{ matrix.id }}" "release/${{ matrix.id }}"

  candidate:
    needs: [matrix, host, backend, linux-consumer]
    if: inputs.validate_candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: sudo apt-get update && sudo apt-get install -y binutils
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: host-*
          path: release-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-*
          path: release-artifacts
      - run: bun run packages/release/scripts/assemble.ts release-artifacts release-candidate
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.matrix.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      - id: npm-candidate
        run: >-
          bun run packages/release/scripts/prepare-npm.ts
          release/npm-candidate
          --manifest release-candidate/magnitude-release.json
      - run: bun run scripts/accept-release-candidate.ts release-candidate "${{ steps.npm-candidate.outputs.tarball }}"
